name: Checks and release
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
        working-directory: agent
      - run: pnpm test
        working-directory: agent
      - run: node scripts/smoke.mjs
        working-directory: agent
      - run: pnpm install --frozen-lockfile && pnpm build
        working-directory: web
      - run: bash -n install.sh
      - run: bash agent/scripts/legacy-update-test.sh
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const version = JSON.parse(fs.readFileSync('agent/package.json', 'utf8')).version;
            const tag = `v${version}`;
            try { await github.rest.repos.getReleaseByTag({ ...context.repo, tag }); return; }
            catch (error) { if (error.status !== 404) throw error; }
            await github.rest.repos.createRelease({ ...context.repo, tag_name: tag, target_commitish: context.sha, name: `Aegis ${tag}`, body: fs.readFileSync('RELEASE_NOTES.md', 'utf8'), draft: false, prerelease: false });
